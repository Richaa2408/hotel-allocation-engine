# StayFlow with Docker.
#
#   Development: `mvnw spring-boot:run` starts only the database below automatically
#                (spring-boot-docker-compose), or start it by hand with `docker compose up -d db`.
#   Full stack:  `docker compose --profile app up --build` builds the app image and runs both,
#                then open http://localhost:8080.
#
# Local credentials only: change them for any shared or hosted deployment.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: stayflow
      POSTGRES_USER: stayflow
      POSTGRES_PASSWORD: stayflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stayflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayflow -d stayflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    # Database browser at http://localhost:5050, with the StayFlow database already listed.
    # Runs in desktop mode: no pgAdmin login. Only reachable from this machine.
    image: dpage/pgadmin4:9
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: stayflow
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin

  app:
    # Only started with `--profile app`, so development runs never build or start it.
    profiles: ["app"]
    build: .
    image: stayflow:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/stayflow
      SPRING_DATASOURCE_USERNAME: stayflow
      SPRING_DATASOURCE_PASSWORD: stayflow
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  stayflow-data:
  pgadmin-data:
