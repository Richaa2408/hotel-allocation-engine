spring.application.name=stayflow

# A yes/no field left out of the JSON (e.g. "accessible") means false instead of rejecting the request.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Browsers recheck the frontend files on every load, so a changed page is never served from an old cache.
spring.web.resources.cache.cachecontrol.no-cache=true

# ---------- Database ----------
# PostgreSQL runs in Docker from compose.yaml. Spring Boot starts it automatically and fills in the
# connection details; it keeps running after the app stops, so restarts are quick and data is kept.
spring.docker.compose.lifecycle-management=start-only
# The schema comes only from Flyway migrations (src/main/resources/db/migration); Hibernate just checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Load related rows (a reservation's guest, an assignment's room) up to 100 at a time with one IN query,
# instead of one query per row (the "N+1 queries" problem: Analytics took 50 s without this).
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ---------- Demo data ----------
# Seeded on first start into an empty database. Change the seed for a different, repeatable hotel.
stayflow.seed.enabled=true
stayflow.seed.seed=42
# Demo staff logins for local use only. Change or remove them before any shared deployment.
stayflow.seed.users[0].username=admin
stayflow.seed.users[0].password=admin-demo-2026
stayflow.seed.users[0].display-name=Priya Admin
stayflow.seed.users[0].role=ADMIN
stayflow.seed.users[1].username=manager
stayflow.seed.users[1].password=manager-demo-2026
stayflow.seed.users[1].display-name=Arjun Manager
stayflow.seed.users[1].role=MANAGER
stayflow.seed.users[2].username=frontdesk
stayflow.seed.users[2].password=frontdesk-demo-2026
stayflow.seed.users[2].display-name=Neha Front Desk
stayflow.seed.users[2].role=FRONT_DESK

# ---------- API docs ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Swagger UI sends the XSRF-TOKEN cookie back as a header, so "Try it out" works once signed in to the app.
springdoc.swagger-ui.csrf.enabled=true
