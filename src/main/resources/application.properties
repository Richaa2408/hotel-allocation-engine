spring.application.name=hotel-allocation-engine

# A yes/no field left out of the JSON (e.g. "accessible") means false instead of rejecting the request.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Browsers recheck the frontend files on every load, so a changed page is never served from an old cache.
spring.web.resources.cache.cachecontrol.no-cache=true

# Sample hotel loaded at startup. Change the seed for a different (but repeatable) hotel.
hotel.sample.enabled=true
hotel.sample.seed=42
