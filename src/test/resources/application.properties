# Tests use an in-memory H2 database in PostgreSQL mode, so `mvnw test` needs no Docker.
spring.datasource.url=jdbc:h2:mem:stayflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.docker.compose.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Smaller demo hotel for tests: same generator, fewer future bookings, so startup stays fast.
stayflow.seed.enabled=true
stayflow.seed.seed=42
stayflow.seed.users[0].username=admin
stayflow.seed.users[0].password=test-admin-pass
stayflow.seed.users[0].display-name=Test Admin
stayflow.seed.users[0].role=ADMIN
stayflow.seed.users[1].username=manager
stayflow.seed.users[1].password=test-manager-pass
stayflow.seed.users[1].display-name=Test Manager
stayflow.seed.users[1].role=MANAGER
stayflow.seed.users[2].username=frontdesk
stayflow.seed.users[2].password=test-frontdesk-pass
stayflow.seed.users[2].display-name=Test Front Desk
stayflow.seed.users[2].role=FRONT_DESK
